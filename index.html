<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Enrollment Overview Export</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky lookup bar, identity summary with copyable IDs, a toolbar of section chips and toggles, then section cards in two columns and full-width tables for repeating records */
:root{
  --bg:#f2f5f6; --surface:#ffffff; --surface-2:#e8eff0; --fg:#0f2328; --muted:#53686e; --line:#d5dfe2;
  --accent:#0b6e66; --accent-fg:#ffffff; --accent-soft:#d6efea;
  --warn-bg:#fff0d4; --warn-fg:#774700; --ok-bg:#dcf2e3; --ok-fg:#14532d; --bad-bg:#fbe1de; --bad-fg:#8f1d12; --err:#a3261b;
  --shadow:0 1px 2px rgba(16,36,41,.06);
  --font-display:'Source Sans 3',Calibri,'Segoe UI',system-ui,sans-serif;
  --font-body:'Source Sans 3',Calibri,'Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1618;--surface:#122125;--surface-2:#192d32;--fg:#e4eef0;--muted:#91a7ad;--line:#24383d;--accent:#4cc3b6;--accent-fg:#05201d;--accent-soft:#163f3a;--warn-bg:#3a2c0e;--warn-fg:#f2c86f;--ok-bg:#12341f;--ok-fg:#8fe0a8;--bad-bg:#3d1713;--bad-fg:#ff9f93;--err:#ff8a7d;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1618;--surface:#122125;--surface-2:#192d32;--fg:#e4eef0;--muted:#91a7ad;--line:#24383d;--accent:#4cc3b6;--accent-fg:#05201d;--accent-soft:#163f3a;--warn-bg:#3a2c0e;--warn-fg:#f2c86f;--ok-bg:#12341f;--ok-fg:#8fe0a8;--bad-bg:#3d1713;--bad-fg:#ff9f93;--err:#ff8a7d;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--font-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{padding-block:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar form{flex:1 1 360px;min-width:0;display:flex;gap:8px}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:12px;top:50%;translate:0 -50%;width:16px;height:16px;color:var(--muted);pointer-events:none}
input[type=text],input[type=search],input[type=password],input[type=email],input[type=url]{width:100%;font:14px var(--font-mono);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
.search input{padding-left:36px}
input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
button{font:600 15px var(--font-body);border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--accent);color:var(--accent-fg);white-space:nowrap}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button.quiet{background:transparent;color:var(--muted);border:1px solid var(--line)}
button:hover:not(:disabled){filter:brightness(1.07)}
button:focus-visible,a:focus-visible,.chip:focus-visible,summary:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
button:disabled{opacity:.55;cursor:default}
main.wrap{padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.hero-top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-start;justify-content:space-between}
.eyebrow{font:500 12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);overflow-wrap:anywhere}
h1{font:700 32px/1.15 var(--font-display);margin:4px 0 4px;text-wrap:balance;overflow-wrap:anywhere}
.sub{color:var(--muted);margin:0;max-width:72ch}
.pill{padding:4px 12px;border-radius:999px;background:var(--warn-bg);color:var(--warn-fg);font:500 12px var(--font-mono);letter-spacing:.04em;white-space:nowrap;text-transform:uppercase}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)}.pill.bad{background:var(--bad-bg);color:var(--bad-fg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.kpi{background:var(--surface-2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi-l{font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi-v{display:flex;align-items:center;justify-content:space-between;gap:8px;font:500 15px var(--font-mono);min-width:0;font-variant-numeric:tabular-nums}
.kpi-v span{overflow-wrap:anywhere}
.tools{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tools-row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;min-width:0}
.chip{flex:none;font:500 13px var(--font-body);color:var(--fg);background:var(--surface-2);border:1px solid transparent;border-radius:999px;padding:5px 12px;text-decoration:none}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.filter{flex:1 1 220px;min-width:0;max-width:320px}
.spacer{flex:1}
#msg{min-height:1.4em;color:var(--muted);font-size:14px;margin:0}
#msg.error{color:var(--err)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:16px;align-items:start}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 18px 12px;box-shadow:var(--shadow);min-width:0;scroll-margin-top:96px}
section.wide{grid-column:1/-1}
h2{font:700 19px var(--font-display);margin:14px 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font:500 11px var(--font-mono);color:var(--muted);letter-spacing:.06em;white-space:nowrap}
h3{font:600 12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:16px 0 2px}
.row{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:0 12px;padding:7px 0;border-top:1px solid var(--line);align-items:start;min-width:0}
h3 + .row,h2 + .row{border-top:0}
.row dt{color:var(--muted);font-size:14px;padding-top:1px}
.row dd{margin:0;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.row dd.empty{color:var(--muted)}
.row dd.masked{letter-spacing:.08em}
.copy{background:transparent;color:var(--muted);padding:2px 8px;font:500 12px var(--font-body);border:1px solid transparent;border-radius:6px;opacity:0}
.row:hover .copy,.row:focus-within .copy,.copy:focus-visible,.kpi .copy{opacity:1}
.copy:hover:not(:disabled){color:var(--accent);border-color:var(--line);filter:none}
@media (hover:none){.copy{opacity:1}}
mark{background:var(--accent-soft);color:inherit;border-radius:3px}
.tbl{overflow-x:auto;margin:6px 0 4px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
th{font:600 12px var(--font-body);color:var(--muted);background:var(--surface-2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
.none{padding:24px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.steps{margin:0;padding-left:20px;color:var(--muted);display:flex;flex-direction:column;gap:4px;max-width:72ch}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 16px}
.settings summary{cursor:pointer;font-weight:600;padding:10px 0}
.settings .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;padding:4px 0 14px}
.settings label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.settings .actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-bottom:14px}
.note{font-size:13px;color:var(--muted);margin:0 0 12px;max-width:80ch}
@media(max-width:560px){
  h1{font-size:25px}
  .row{grid-template-columns:1fr auto}
  .row dt{grid-column:1/-1;padding-bottom:0}
  .bar form{flex-basis:100%}
  .filter{max-width:none}
}
</style>

<div class="bar"><div class="wrap">
  <form id="lookup" autocomplete="off">
    <div class="search">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13.5 13.5 4 4" stroke-linecap="round"/></svg>
      <input type="text" id="link" aria-label="Enrollment link or ID" placeholder="Paste an enrollment link or ID" spellcheck="false">
    </div>
    <button type="submit" id="load">Show details</button>
  </form>
  <button id="dl" type="button" class="ghost" disabled>Download Excel</button>
</div></div>
<main class="wrap">
<details class="settings" id="settings">
  <summary>Connection settings</summary>
  <p class="note" id="connNote">This page calls the Assured platform API with your own access. Sign in with your platform email and password, or paste an access token. Treat the token like a password: it gives the same access as your login.</p>
  <div class="fields">
    <label for="apiBase">API address<input type="url" id="apiBase" spellcheck="false"></label>
    <label for="apiToken">Access token<input type="password" id="apiToken" placeholder="Paste a platform access token" autocomplete="off" spellcheck="false"></label>
    <label for="loginEmail">Platform email<input type="email" id="loginEmail" autocomplete="username"></label>
    <label for="loginPass">Password<input type="password" id="loginPass" autocomplete="current-password"></label>
  </div>
  <div class="actions">
    <button type="button" id="saveConn">Save token</button>
    <button type="button" id="signIn" class="ghost">Sign in with email</button>
    <label class="toggle" id="rememberWrap"><input type="checkbox" id="remember"> Remember on this device</label>
    <button type="button" id="forget" class="quiet">Forget token</button>
    <span id="connState" class="note" role="status"></span>
  </div>
</details>

  <div class="hero" id="hero"></div>
  <div class="tools" id="tools" hidden>
    <div class="tools-row">
      <input type="search" id="filter" class="filter" placeholder="Filter fields" aria-label="Filter fields" autocomplete="off">
      <label class="toggle"><input type="checkbox" id="showSens"> Show sensitive values</label>
      <label class="toggle"><input type="checkbox" id="hideEmpty"> Hide empty fields</label>
      <label class="toggle"><input type="checkbox" id="omitSecrets"> Mask SSN and bank numbers in Excel</label>
      <span class="spacer"></span>
      <button type="button" id="copyAll" class="quiet">Copy all fields</button>
      <span id="extras" style="display:contents"></span>
    </div>
    <nav class="chips" id="chips" aria-label="Sections"></nav>
  </div>
  <p id="msg" role="status" aria-live="polite"></p>
  <div class="grid" id="sections"></div>
</main>

  /* ---------- formatting ---------- */
  function humanize(s){

  /* ---------- catalog ---------- */

  /* Sub-section placement keeps related fields together the way the platform profile tabs do. */
  var PROVIDER_SUBS = [
    ["Personal Information", /^(full_name|first_name|middle_name|last_name|suffix|gender|birth_\w+|race|county|height_inches|weight_in_lbs|hair_color|eye_color)$/],

  function subOf(list, field){

  /* Build rows for one catalog group against one record. */

    var seen = {}, out = [];

  }

  /* ---------- tables (repeating records) ---------- */
  var TABLES = [
    ["Professional IDs", "prof_ids", [["Professional Id Type","professional_id_type"],["State","state"],["Number","number"],["Issue Date","issue_date"],["Expiration Date","expiration_date"],["License Type","license_type"],["Duration Type","duration_type"],["License Unlimited","license_unlimited"],["Is Currently Practicing In State","is_currently_practicing_in_state"],["Available","is_available"],["Used For This Enrollment","_active"]]],

    ["Work History", "employment", [["Employer Name","employer_name"],["Type","type"],["Currently Employed","currently_employed"],["Start Date","start_date"],["End Date","end_date"],["Address","address"],["City","city"],["State","state"],["Zip Code","zip_code"],["Country","country"],["Phone Number","phone_number"],["Email Address","email_address"],["Contact Information","contact_information"],["Reason For Discontinuance","reason_for_discontinuance"],["Gap Explanation","gap_explanation"]]],

  function buildTables(raw, activeIds){

/* Loads one enrollment from the Assured REST API (the same endpoints the platform UI uses).

function makeRestLoader(httpMany){
